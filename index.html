<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cours animés</title>
<style>
:root{--bg:#f5f5f7;--surface:#fff;--text:#1d1d1f;--text-2:#6e6e73;--accent:#0071e3;--shadow:0 2px 6px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--surface:#1c1c1e;--text:#f5f5f7;--text-2:#a1a1a6;--accent:#2997ff;--shadow:0 0 0 1px rgba(255,255,255,.06)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;letter-spacing:-.022em;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:0 auto;padding:72px 22px 96px}
h1{font-size:clamp(40px,7vw,56px);letter-spacing:-.035em;line-height:1.05;margin:0 0 12px}
p{color:var(--text-2);font-size:21px;margin:0 0 40px;max-width:640px}
.eyebrow{font-size:14px;font-weight:600;color:var(--accent);margin:0 0 12px}
a.card{display:block;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:26px 28px;color:inherit;text-decoration:none;transition:transform .3s cubic-bezier(.25,.1,.25,1)}
a.card:hover{transform:translateY(-3px)}
a.card h2{margin:0 0 6px;font-size:24px;letter-spacing:-.025em}
a.card span{color:var(--text-2);font-size:15px}
</style>
</head>
<body>
<main>
  <h1>Cours animés.</h1>
  <p>Chaque notion expliquée pas à pas, avec ses animations, son monde réel et sa fiche de révision.</p>
  <p class="eyebrow">Fil rouge Instagram</p>
  <a class="card" href="notions/diagramme-de-sequence/"><h2>Lire un diagramme de séquence</h2><span>Ce qui se passe quand tu aimes une photo.</span></a>
</main>
</body>
</html>
